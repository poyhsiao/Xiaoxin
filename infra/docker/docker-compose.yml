version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: xiaoxin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  logto:
    image: svhd/logto:latest
    ports:
      - "3001:3001"
    environment:
      - TRUNK_URL=https://git.cozy.com
      - DB_URL=postgresql://postgres:password@postgres:5432/logto
      - SECRET=your_logto_secret_min_32_chars
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
