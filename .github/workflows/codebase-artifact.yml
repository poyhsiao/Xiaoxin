name: Update Codebase Artifact

# When source code changes, notify teammates to regenerate local artifact.
# Automated re-index via CI is not yet supported (codebase-memory-mcp has no CLI).
# Teammates: after pulling, run `mcp__codebase-memory-mcp__index_repository` to regenerate.
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '!apps/**/dist/**'
      - '!apps/**/node_modules/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig/**'
      - '!.github/workflows/**'

# Only keep the latest run to avoid notification spam
concurrency:
  group: artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .codebase-memory/graph.db.zst
            .gitattributes
          sparse-checkout-cone-mode: false

      - name: Verify artifact present
        run: |
          if [ -f ".codebase-memory/graph.db.zst" ]; then
            echo "Artifact is up to date: $(du -h .codebase-memory/graph.db.zst | cut -f1)"
            echo "Teammates: after \`git pull\`, run \`/index-repo\` in Claude Code to re-index if needed."
          else
            echo "WARNING: graph.db.zst not found in the commit"
            exit 1
          fi
