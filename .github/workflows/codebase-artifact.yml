name: Update Codebase Artifact

# Re-index when source code changes, commit updated artifact
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '!apps/**/dist/**'
      - '!apps/**/node_modules/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig/**'
      - '!.github/workflows/**'

# Only keep the latest run to avoid artifact spam
concurrency:
  group: artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .codebase-memory
            .gitattributes
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-index codebase
        run: |
          # Re-export artifact using MCP CLI tool
          npx --yes @modelcontextprotocol/server-codebase-memory \
            --repo-path . \
            --mode full \
            --persistence

      - name: Detect artifact changes
        id: changed
        run: |
          if git diff --quiet .codebase-memory/graph.db.zst; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated artifact
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .codebase-memory/graph.db.zst
          git commit -m "chore: update codebase-memory artifact [skip ci]"
          git push
